<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAGTruth explorer</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="chrome">
    <header class="top">
      <div class="brand">
        <h1>RAGTruth</h1>
        <span id="tagline" class="tagline"></span>
      </div>
      <nav class="tabs" role="tablist" aria-label="View">
        <button class="tabbtn" role="tab" data-view="overview" aria-selected="true" title="Aggregate patterns (1)">Overview</button>
        <button class="tabbtn" role="tab" data-view="browse" aria-selected="false" title="Individual responses (2)">Browse</button>
      </nav>
      <button id="theme" class="btn small" type="button" title="Toggle light/dark (t)">Theme</button>
    </header>
    <div id="filters" class="filters"></div>
  </div>

  <main id="overview" class="view overview"></main>
  <main id="browse" class="view browse" hidden></main>
  <div id="boot" class="boot">Loading the corpus…</div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
